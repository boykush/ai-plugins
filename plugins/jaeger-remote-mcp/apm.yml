# upstream: boykush/infrastructure-as-code/plugins/jaeger-remote-mcp#6bd55b201a74949c8c432cdfb9dfca8e1515a39b
# mise run generate がこの Agent Plugin から書いた。直すのは上流の plugin で、ここは書き換えない。
name: "jaeger-remote-mcp"
version: "0.1.0"
description: "Remote MCP server for the traces boykush's cluster workloads send to Jaeger. Read what a workload did from any repository without restating the server in each one. Behind Cloudflare Access - the first call signs in through the client's OAuth flow."
author: "boykush"
dependencies:
  apm: []
  mcp:
    - name: "jaeger"
      registry: false
      transport: http
      url: "https://jaeger-mcp.boykush.com/mcp"
