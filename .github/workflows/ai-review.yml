# Reviews the owner's pull requests against the rules in boykush/adr, and approves the
# ones that pass as the Claude GitHub App: the approval the default branch's ruleset asks
# for. The reusable workflow lives in boykush/workflows, whose README lists what adopting
# it takes.
name: ai-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ai-review:
    # main, not a SHA as in other repositories: boykush/workflows pins this repository
    # by SHA in its apm.yml, and pinning it back would have Renovate bump the two in turn
    # forever. A pull request here still can't change the review that judges it.
    uses: boykush/workflows/.github/workflows/ai-review.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
