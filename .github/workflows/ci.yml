name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the job grants only what it needs.
permissions: {}

# Cancel superseded runs on the same ref (e.g. successive pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: agents
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: apm jq

      # Renovate は upstream 行の SHA を上げるだけなので、その commit の plugin から書き直して
      # 合っているかを見る。上流で skill や接続先が変わっていればここで止まる。
      - name: Check generated packages match their upstream plugins
        run: mise run generate && git diff --exit-code -- plugins

      # 配布側に生成物を置かないので、使い捨ての consumer に install して
      # 宣言した URL と skill が Claude 向けと Codex 向けの両方に落ちることを見る。
      - name: Check packages deploy to both clients
        run: mise run check
