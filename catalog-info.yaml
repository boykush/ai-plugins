# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (boykush/infrastructure-as-code's applications/backstage/).
# How an entity is written — which edges to draw, what a tag means — is set in
# boykush/github-management's AGENTS.md and the comments atop its catalog/ files.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ai-plugins
  description: >-
    repo をまたいで使う AI 向けの設定（MCP サーバーの接続先・skill）を apm package として配る置き場。実体は各
    repo が Agent Plugins の形で持ち、ここはそれを apm の package に書き直す（どれを取り込むかは marketplace の
    AiResource が持つ）。配る物は自分では使わず、使う側の repo が apm.yml で依存を宣言する——catalog だけは、
    配る先を見るためにここでも引く。対象は fork と archive を除く owned repo
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: agent-config
  consumesApis:
    - catalog-mcp
  dependsOn:
    - component:infrastructure-as-code
    - component:workflows
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: ai-plugins
  description: >-
    各 repo が Agent Plugins の形で持つ plugin を、apm の package に書き直して配る marketplace。consumer は
    plugin の repo ではなくここの package に依存する
spec:
  type: marketplace
  lifecycle: production
  owner: user:boykush
  system: agent-config
  plugins:
    - airesource:adr-remote-mcp
    - airesource:wiki-remote-mcp
    - airesource:catalog-remote-mcp
    - airesource:jaeger-remote-mcp
